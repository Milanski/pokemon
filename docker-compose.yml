services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pokemon_collection
      POSTGRES_USER: pokemon
      POSTGRES_PASSWORD: pokemon
    ports:
      - "5434:5432"
    volumes:
      - pokemon-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokemon -d pokemon_collection"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/pokemon_collection
      DB_USERNAME: pokemon
      DB_PASSWORD: pokemon
      JWT_SECRET: local-development-secret-please-change-me-32bytes+
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8081
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pokemon-db-data:
