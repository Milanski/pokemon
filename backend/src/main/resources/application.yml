server:
  port: 8080

spring:
  application:
    name: pokemon-collection
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pokemon_collection}
    username: ${DB_USERNAME:pokemon}
    password: ${DB_PASSWORD:pokemon}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  pokeapi:
    base-url: ${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
    connect-timeout-millis: 5000
    read-timeout-millis: 10000
  rate-limit:
    # Applied per client IP to /api/auth/register and /api/auth/login, to
    # slow down account-enumeration and credential-stuffing attempts.
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:20}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

resilience4j:

  retry:
    retry-aspect-order: 2
    instances:
      pokeApi:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.RestClientException
        # A 404 is a normal "this Pokémon doesn't exist" outcome, not a
        # dependency failure - retrying it would be pointless, and ignoreExceptions
        # takes precedence over retryExceptions when both match.
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException.NotFound
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      pokeApi:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # Same reasoning as the retry instance: a 404 must not count towards
        # the failure rate, or trainers browsing unknown/invalid ids could
        # trip the breaker for everyone even though PokéAPI is healthy.
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException.NotFound

logging:
  level:
    com.mbls.challenge.pokemon: INFO
